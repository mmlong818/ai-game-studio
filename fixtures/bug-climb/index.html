<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="./styles.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15261d">
<title>虫虫攀枝</title>
</head>
<body data-game-state="idle">
<div class="app">
<header class="mast">
  <div class="brand">虫虫攀枝<small>爬向树冠的小小冒险</small></div>
  <div class="tag">树皮下掠 · 露珠冲刺</div>
</header>
<main class="layout">
<section class="gameShell">
<div class="stage">
<canvas id="game-canvas" width="900" height="675" aria-label="三路线Q版昆虫爬树游戏区"></canvas>
<div class="hud">
  <div class="hudBlock">花粉 · 连续<strong><span id="score">0</span> ×<span id="multi">1</span></strong></div>
  <div class="timer" id="timerPanel"><span><span id="time">34.0</span>秒</span><small id="laneLabel">中纹</small></div>
  <div class="hudBlock right">攀爬 · 树层<strong><span id="speed">0</span><small class="speedUnit"> CM/S</small> · <span id="level">0</span>/3</strong><em id="speedState">准备出发</em></div>
</div>
<div class="bars">
  <div class="barBox">体力<div class="meter"><div class="fill" id="hpFill"></div></div></div>
  <div class="barBox">露珠能量<div class="meter"><div class="fill" id="nitroFill"></div></div></div>
</div>
<div class="routeDock" aria-label="树层进度">
  <div class="route" id="route"><i></i><i></i><i></i><i></i></div>
  <span id="routeText">树层 0/3 · 树冠尚未开放</span>
</div>
<div class="toast" id="toast"></div><div class="flash" id="flash"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
</div>
<div class="controls">
  <button class="ctrl" id="left" aria-label="向左侧树纹移动"><span aria-hidden="true">←</span> 左爬</button>
  <button class="ctrl" id="up" aria-label="向树干上方移动"><span aria-hidden="true">↑</span> 上爬</button>
  <button class="ctrl" id="down" aria-label="向树干下方移动"><span aria-hidden="true">↓</span> 下爬</button>
  <button class="ctrl" id="right" aria-label="向右侧树纹移动">右爬 <span aria-hidden="true">→</span></button>
  <button class="ctrl" id="boost" aria-label="按住使用露珠能量冲刺">按住露珠冲刺</button>
</div>
<div class="utility"><button id="restart" hidden>重新出发</button><button id="sound">自然音：开</button></div>
</section>
</main>
</div>
<script src="./app.js"></script>
</body>
</html>
